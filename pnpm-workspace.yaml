packages:
  - packages/*
  - apps/*
  # examples/pg-dotnet has no package.json, so pnpm ignores it; it is built by the
  # dotnet job in examples.yml instead.
  - examples/*

# Security overrides for transitive deps. This is the only place pnpm reads them:
# an `overrides` block in a workspace member is ignored outright (that is how
# cookie/esbuild silently regressed to vulnerable versions during the website
# import), and the root `package.json` `pnpm.overrides` field still works but
# pnpm 10 warns it is on its way out.
#   cookie <0.7.0:    CVE-2024-47764
#   esbuild <=0.24.2: GHSA-67mh-4wv8-2f99
# Expressed as floors, not ranges: these exist only to escape the advisories
# below, and a `^` range silently DOWNGRADES a member that legitimately wants a
# newer line (apps/tb-addon declares esbuild ^0.28.0 and was pinned back to
# 0.27.7 by the old `^0.27.2`). A floor keeps the advisory closed without
# deciding which newer major a package may use.
overrides:
  # Scoped, and load-bearing: @sveltejs/kit declares cookie ^0.6.0, so this is
  # the only reason the tree resolves 1.1.1 rather than a pre-CVE-2024-47764
  # copy. Do not remove it; scoping just stops it replacing a specifier some
  # other package legitimately chose.
  '@sveltejs/kit>cookie': '>=1.1.1'
  # Scoped to the vulnerable transitive path only. A bare `esbuild` override
  # REPLACES each package's own specifier, which silently pinned apps/tb-addon
  # (declares ^0.28.0) back to 0.27.7. svelte-i18n is the only path that pulls a
  # pre-fix esbuild (0.19.12 without this).
  'svelte-i18n>esbuild': '>=0.27.2'

  # The apps/outlook-addon import surfaced three advisories, all in dev tooling
  # (eslint plugins, office-addin-*, webpack-dev-server) and none reachable from
  # shipped code — brace-expansion appears 0 times in the built taskpane bundle.
  #
  # They are deliberately NOT pinned here. Forcing them breaks the toolchain:
  # `brace-expansion: '>=5.0.8'` pushed every minimatch in the tree onto
  # brace-expansion 5, whose namespace export minimatch 3 and 9 both fail to
  # interop with (`TypeError: expand is not a function` on any lint run). A floor
  # is safe against DOWNGRADES, which is why the esbuild entry above uses one,
  # but it can still cross a breaking major — the mistake this comment records.
  #
  # Tracked in encryption4all/postguard-js#142: the real fix is moving the
  # office-addin and eslint-plugin chains off the pinned transitive versions,
  # not overriding them from here.
