name: Delivery

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    integration:
        name: Integration
        uses: ./.github/workflows/integration.yml

    release:
        name: Release
        needs: integration
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The Version Packages PR this opens carries no pre-merge CI:
            # GITHUB_TOKEN-triggered events start no workflows at all. The
            # publish itself stays gated — `needs: integration` runs the full
            # matrix on the version commit's push to main before this job.
            - name: Version or publish (changesets)
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm version-packages
                  publish: pnpm release
                  title: 'chore: version packages'
                  commit: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # pnpm ignores publishConfig.provenance; the npm-config key
                  # is what `pnpm publish` (via changeset publish) reads.
                  NPM_CONFIG_PROVENANCE: 'true'
                  # `pnpm release` is `pnpm --filter @e4a/pg-js build && changeset
                  # publish` — deliberately filtered, not `pnpm -r build`.
                  #
                  # @e4a/pg-js is the only publishable package here; every app is
                  # private. A recursive build put all three apps' build
                  # preconditions in front of `changeset publish`, so any of them
                  # failing broke the pg-js npm release rather than just its own
                  # image. That already cost one incident via apps/tb-addon, whose
                  # build fail-closes without backend URLs, and apps/outlook-addon
                  # since made it worse: its build now also fails on the *value* of
                  # POSTGUARD_WEBSITE_URL, because the manifest refuses to ship
                  # without an <AppDomain> for the origin it is given. The set of
                  # acceptable values lived in a file in a different app.
                  #
                  # Filtering removes the whole class instead of enumerating it:
                  # the apps are built and published by their own workflows, and
                  # `needs: integration` above still runs the full recursive build
                  # on this commit before anything is released.
