name: Integration

on:
    pull_request:
        branches: [main]
    workflow_call:

jobs:
    node:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22', '24']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm -r typecheck

            - name: Build
              run: pnpm -r build
              # apps/tb-addon's build fail-closes when the backend URLs are
              # unset, rather than silently producing an addon pointed at the
              # wrong deployment. That is worth keeping, so this recursive build
              # supplies the same defaults apps/tb-addon's own workflow uses.
              env:
                  PKG_URL: ${{ vars.PKG_URL || 'https://pkg.postguard.eu' }}
                  CRYPTIFY_URL: ${{ vars.CRYPTIFY_URL || 'https://storage.postguard.eu' }}
                  POSTGUARD_WEBSITE_URL: ${{ vars.POSTGUARD_WEBSITE_URL || 'https://postguard.eu' }}

            - name: Test
              run: pnpm -r test

            - name: Smoke (dry run on Node)
              working-directory: packages/pg-js
              run: node scripts/smoke.mjs

    api-surface:
        name: API surface
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  # api:gate compares against the merge base of the base branch
                  # and HEAD. A shallow clone has no common ancestor to find, and
                  # the script fails with that message rather than guessing.
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # actions/checkout leaves the base branch out of the local refs. On
            # the workflow_call from delivery.yml there is no base ref, so main is
            # the fallback and the comparison comes out empty.
            - name: Fetch the base branch
              shell: bash
              run: |
                  BASE="${GITHUB_BASE_REF:-main}"
                  git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

            - name: Build
              run: pnpm -r build
              # apps/tb-addon's build fail-closes without the backend URLs.
              env:
                  PKG_URL: ${{ vars.PKG_URL || 'https://pkg.postguard.eu' }}
                  CRYPTIFY_URL: ${{ vars.CRYPTIFY_URL || 'https://storage.postguard.eu' }}
                  POSTGUARD_WEBSITE_URL: ${{ vars.POSTGUARD_WEBSITE_URL || 'https://postguard.eu' }}

            # Fails when the report is stale (also caught by postbuild above) or
            # when the pending changeset is smaller than the API diff needs.
            - name: Public API surface gate
              working-directory: packages/pg-js
              shell: bash
              run: pnpm api:gate

    bun:
        name: Bun ${{ matrix.bun }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                bun: ['1.3.14']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js (for pnpm + generators)
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm -r build
              # apps/tb-addon's build fail-closes when the backend URLs are
              # unset, rather than silently producing an addon pointed at the
              # wrong deployment. That is worth keeping, so this recursive build
              # supplies the same defaults apps/tb-addon's own workflow uses.
              env:
                  PKG_URL: ${{ vars.PKG_URL || 'https://pkg.postguard.eu' }}
                  CRYPTIFY_URL: ${{ vars.CRYPTIFY_URL || 'https://storage.postguard.eu' }}
                  POSTGUARD_WEBSITE_URL: ${{ vars.POSTGUARD_WEBSITE_URL || 'https://postguard.eu' }}

            - name: Test (vitest on Bun runtime)
              working-directory: packages/pg-js
              run: bunx vitest run

            - name: Smoke (dry run on Bun)
              working-directory: packages/pg-js
              run: bun scripts/smoke.mjs

    deno:
        name: Deno ${{ matrix.deno }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                deno: ['2.8.0']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js (for pnpm + generators)
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: ${{ matrix.deno }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm -r build
              # apps/tb-addon's build fail-closes when the backend URLs are
              # unset, rather than silently producing an addon pointed at the
              # wrong deployment. That is worth keeping, so this recursive build
              # supplies the same defaults apps/tb-addon's own workflow uses.
              env:
                  PKG_URL: ${{ vars.PKG_URL || 'https://pkg.postguard.eu' }}
                  CRYPTIFY_URL: ${{ vars.CRYPTIFY_URL || 'https://storage.postguard.eu' }}
                  POSTGUARD_WEBSITE_URL: ${{ vars.POSTGUARD_WEBSITE_URL || 'https://postguard.eu' }}

            - name: Test (vitest on Deno runtime)
              working-directory: packages/pg-js
              run: deno run --allow-all npm:vitest run

            - name: Smoke (dry run on Deno)
              working-directory: packages/pg-js
              run: deno run -A scripts/smoke.mjs
