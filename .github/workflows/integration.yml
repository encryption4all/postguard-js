name: Integration

# `edited` is in the list because two jobs here — `envelope-compat` and
# `api-surface` — derive their verdict from the MERGE BASE of the base branch and
# HEAD, so the result is only valid against the base they ran against. The default
# trigger set is opened/synchronize/reopened; retargeting a PR fires `edited`, and
# without it the stale check-run stays attached to the unchanged head sha and
# GitHub reports it as current. A required check would then pass on a comparison
# never made against the actual merge target.
on:
    pull_request:
        types: [opened, synchronize, reopened, edited]
        branches: [main]
    workflow_call:

# apps/tb-addon's build fail-closes when the backend URLs are unset, rather than
# silently producing an addon pointed at the wrong deployment. That is worth
# keeping, so every recursive build here supplies the same defaults the addon's
# own workflow uses — once, rather than per step.
env:
    PKG_URL: ${{ vars.PKG_URL || 'https://pkg.postguard.eu' }}
    CRYPTIFY_URL: ${{ vars.CRYPTIFY_URL || 'https://storage.postguard.eu' }}
    POSTGUARD_WEBSITE_URL: ${{ vars.POSTGUARD_WEBSITE_URL || 'https://postguard.eu' }}

jobs:
    # The broad lane, deliberately. It runs the recursive typecheck, build and test
    # rather than filtering to the SDK the way `api-surface`, `bun` and `deno` do,
    # because whole-workspace coverage is its job: apps/website and both addons
    # included, which is what the `env:` block above exists to supply. Narrowing it
    # would remove that coverage rather than relocate it. examples/* is cheap here,
    # and examples.yml covering them again is duplication rather than a gap.
    node:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22', '24']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Cheap, and it guards a failure that already shipped unnoticed: a
            # prettier plugin a package declares but the root does not install
            # makes `changeset version` drop that package's CHANGELOG silently,
            # while still exiting 0. See scripts/check-prettier-plugins.mjs.
            - name: Prettier plugins resolve from the root
              run: pnpm check-prettier-plugins

            - name: Typecheck
              run: pnpm -r typecheck

            - name: Build
              run: pnpm -r build

            - name: Test
              run: pnpm -r test

            - name: Smoke (dry run on Node)
              working-directory: packages/pg-js
              run: node scripts/smoke.mjs

    # postguard-js#131. Deliberately NOT path-filtered to src/email/**, though the
    # issue asks for it: a required status check that is path-filtered never
    # reports on PRs which miss the filter, and branch protection then blocks them
    # indefinitely. It runs in seconds, so it is cheap to let it be trivially green.
    envelope-compat:
        name: Envelope compatibility
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  # The append-only check compares against the merge base of the
                  # base branch and HEAD; a shallow clone has no common ancestor
                  # and the script fails rather than guessing.
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # actions/checkout leaves the base branch out of the local refs.
            - name: Fetch the base branch
              shell: bash
              run: |
                  BASE="${GITHUB_BASE_REF:-main}"
                  git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

            # A fixture records bytes a sender actually emitted, so it may be
            # added but never edited or removed. Without this, a failing archival
            # test could be "fixed" by rewriting the evidence.
            - name: Fixture corpus is append-only
              working-directory: packages/pg-js
              run: pnpm envelope:check

            # Both directions. Forward resolves the published readers named in
            # COMPATIBILITY.md's support window; archival replays the corpus.
            - name: Envelope compatibility, both directions
              working-directory: packages/pg-js
              run: pnpm exec vitest run tests/envelope-forward.test.ts tests/envelope-archival.test.ts

    api-surface:
        name: API surface
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  # api:gate compares against the merge base of the base branch
                  # and HEAD. A shallow clone has no common ancestor to find, and
                  # the script fails with that message rather than guessing.
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # actions/checkout leaves the base branch out of the local refs. On
            # the workflow_call from delivery.yml there is no base ref, so main is
            # the fallback and the comparison comes out empty.
            - name: Fetch the base branch
              shell: bash
              run: |
                  BASE="${GITHUB_BASE_REF:-main}"
                  git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

            # Only what the gate reads: api-report.mjs consumes exactly
            # packages/pg-js/dist/index.d.mts, nothing from apps/*. Filtering keeps
            # this job out of the class where a new app's build preconditions
            # become this workflow's, and drops a website + addon build the Node,
            # Bun and Deno lanes already cover.
            - name: Build the SDK
              run: pnpm --filter @e4a/pg-js build

            # Fails when the report is stale (also caught by postbuild above) or
            # when the pending changeset is smaller than the API diff needs.
            - name: Public API surface gate
              working-directory: packages/pg-js
              shell: bash
              run: pnpm api:gate

    bun:
        name: Bun ${{ matrix.bun }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                bun: ['1.3.14']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js (for pnpm + generators)
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Only the SDK: this lane exercises pg-js on the Bun runtime and
            # reads nothing from apps/* or examples/*. Same reasoning as
            # api-surface above — filtering keeps the job out of the class where
            # another package's build preconditions become this workflow's, which
            # the examples import would otherwise extend to two more builds.
            - name: Build the SDK
              run: pnpm --filter @e4a/pg-js build

            - name: Test (vitest on Bun runtime)
              working-directory: packages/pg-js
              run: bunx vitest run

            - name: Smoke (dry run on Bun)
              working-directory: packages/pg-js
              run: bun scripts/smoke.mjs

    deno:
        name: Deno ${{ matrix.deno }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                deno: ['2.8.0']
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js (for pnpm + generators)
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: ${{ matrix.deno }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Only the SDK, as in the Bun lane above.
            - name: Build the SDK
              run: pnpm --filter @e4a/pg-js build

            - name: Test (vitest on Deno runtime)
              working-directory: packages/pg-js
              run: deno run --allow-all npm:vitest run

            - name: Smoke (dry run on Deno)
              working-directory: packages/pg-js
              run: deno run -A scripts/smoke.mjs

    # The single required status check for this workflow.
    #
    # Every lane above is matrix-named — `Node 22`, `Bun 1.3.14`, `Deno 2.8.0` —
    # so the version IS the check name. Requiring those directly would couple
    # branch protection to a version string: bump the matrix and the required
    # check never reports again, leaving main blocked with nothing red to point
    # at and no failing job to fix. This name never changes, so a runtime bump
    # is a one-line matrix edit and nothing else.
    #
    # Adding a lane above? Add it to `needs` here too, or it is not covered by
    # the required check no matter how loudly it fails. That is no longer left to
    # this comment: packages/pg-js/tests/ci-wiring.test.ts derives the lane set
    # from this file and fails until the new lane appears below — along with the
    # rest of what `main`'s twenty required contexts are wired to (#222).
    integration-complete:
        name: Integration complete
        needs: [node, envelope-compat, api-surface, bun, deno]
        # `always()` is load-bearing. Without it this job is SKIPPED when any
        # lane fails, and GitHub counts a skipped check as PASSING for branch
        # protection — the gate would report green on a red build, which is the
        # exact failure mode it exists to prevent.
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Assert every lane succeeded
              shell: bash
              # Through env rather than interpolated into the script body: the
              # values are a controlled enum today, but `run:` interpolation is
              # how a workflow grows an injection later.
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "lane results: ${RESULTS}"
                  # Without this the loop below runs zero times and the step exits
                  # 0 having checked nothing — a required gate that cannot fail.
                  if [ -z "${RESULTS// /}" ]; then
                      echo "::error::no lane results; the needs list resolved to nothing"
                      exit 1
                  fi
                  # Only `success` passes. A lane that starts reporting `skipped`
                  # — because someone gave it an `if:` — fails here on purpose,
                  # rather than quietly dropping out of the required check.
                  for result in ${RESULTS}; do
                      if [ "${result}" != success ]; then
                          echo "::error::an integration lane did not succeed (${RESULTS})"
                          exit 1
                      fi
                  done
                  echo "all lanes succeeded"
